<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탱글아장배 싱글탱글 개인전</title>
    <!-- 귀여운 픽셀 폰트 로드 (갈무리11) -->
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        :root {
            --yellow: #fff07c;
            --pink: #ffa6c9;
            --green: #a7f3d0;
            --blue: #a1ccff;
            --bg-color: #fff0f5;
            --line-color: #ff8da1;
            --text-color: #594a4e;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            /* Y2K 감성 핑크 체크 배경 */
            background-image: 
                linear-gradient(45deg, #ffe4eb 25%, transparent 25%, transparent 75%, #ffe4eb 75%, #ffe4eb), 
                linear-gradient(45deg, #ffe4eb 25%, transparent 25%, transparent 75%, #ffe4eb 75%, #ffe4eb);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: 'Galmuri11', sans-serif;
            color: var(--text-color);
            text-align: center;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            font-size: 3rem;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 
                -3px -3px 0 var(--line-color),  
                 3px -3px 0 var(--line-color),
                -3px  3px 0 var(--line-color),
                 3px  3px 0 var(--line-color),
                 5px  5px 0 #ff6b8b;
            letter-spacing: 2px;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .instructions {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px 25px;
            border: 3px dotted var(--line-color);
            border-radius: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--text-color);
            box-shadow: 3px 3px 0px rgba(255, 141, 161, 0.3);
        }

        /* 컨트롤 패널 */
        .controls {
            margin-bottom: 30px;
        }

        .btn {
            font-family: 'Galmuri11', sans-serif;
            background-color: #fff;
            color: var(--text-color);
            border: 3px solid var(--line-color);
            border-radius: 30px;
            padding: 10px 25px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--line-color);
            transition: all 0.1s;
            margin: 0 5px;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px var(--line-color);
        }

        .btn.edit-mode {
            background-color: var(--yellow);
        }

        /* 대진표 영역 */
        .scroll-wrapper {
            width: 100%;
            max-width: 1400px;
            overflow-x: auto;
            padding: 20px 0 60px 0;
            display: flex;
            justify-content: center;
        }

        .pyramid-container {
            position: relative;
            display: flex;
            flex-direction: column-reverse; /* 아래부터 위로 (16강 -> 결승) */
            align-items: center;
            gap: 40px;
            min-width: 1200px; /* 가로 스크롤 확보 */
        }

        /* 대진 선을 그릴 캔버스 */
        #linesCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* 라운드 및 매치 구조 */
        .row {
            display: flex;
            justify-content: space-around;
            width: 100%;
            z-index: 2;
        }

        .match {
            display: flex;
            gap: 20px;
            position: relative;
            justify-content: center;
        }

        /* 둥둥 떠다니는 버블 (Y2K 스타일) */
        .bubble {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #fff;
            background-color: #f0f0f0; 
            box-shadow: 
                inset -8px -8px 0px rgba(0,0,0,0.08),
                inset 4px 4px 0px rgba(255,255,255,0.8),
                3px 3px 10px rgba(255, 141, 161, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            position: relative;
            transition: transform 0.1s, filter 0.2s;
            user-select: none;
        }

        /* 버블 하이라이트 (광택 효과) */
        .bubble::after {
            content: '';
            position: absolute;
            top: 12%;
            left: 20%;
            width: 25%;
            height: 15%;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: rotate(-25deg);
            pointer-events: none;
        }

        .bubble:hover {
            filter: brightness(1.05);
            transform: scale(1.05);
        }
        
        .bubble:active {
            transform: scale(0.95);
        }

        .bubble.yellow { background-color: var(--yellow); color: var(--text-color); }
        .bubble.pink { background-color: var(--pink); color: var(--text-color); }
        .bubble.green { background-color: var(--green); color: var(--text-color); }
        .bubble.blue { background-color: var(--blue); color: var(--text-color); }
        
        .bubble.empty {
            cursor: default;
            border: 3px dashed #dcb5bf;
            background-color: rgba(255,255,255,0.4);
            box-shadow: none;
        }
        .bubble.empty::after {
            display: none; /* 빈 버블은 광택 제거 */
        }
        .bubble.empty:hover { filter: none; transform: none; }

        /* 버블 안의 텍스트 컨테이너 */
        .name {
            width: 90%;
            text-align: center;
            word-break: break-all;
            line-height: 1.2;
            pointer-events: none;
            z-index: 2; /* 광택 위로 글자 올라오게 */
        }

        .edit-mode .name {
            pointer-events: auto;
            border-bottom: 2px dotted var(--line-color);
            outline: none;
            background: rgba(255,255,255,0.5);
            border-radius: 5px;
            padding: 2px;
        }

        /* 통통 튀는 대기 애니메이션 (값이 있을 때만) */
        .bubble:not(.empty) {
            animation: float 2.5s ease-in-out infinite;
        }
        .bubble:not(.empty):nth-child(even) {
            animation-delay: 1.2s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 팝 이펙트 (터질 때) */
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); filter: brightness(1.2); }
            100% { transform: scale(1); }
        }
        .pop-anim {
            animation: pop 0.3s forwards;
        }

        /* 우승자 버블 특별 처리 */
        #winner {
            width: 110px;
            height: 110px;
            font-size: 1.3rem;
            border-width: 4px;
        }
        #winner::after {
            width: 30%;
            height: 18%;
            top: 15%;
            left: 20%;
        }
        
        /* 파티클 이펙트용 */
        .particle {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 0 5px rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>

    <h1>✨ 탱글아장배 싱글탱글 개인전 ✨</h1>
    
    <div class="instructions">
        🌸 <b>퍼즐버블처럼 귀여운 16강 대진표!</b> 🌸<br>
        <strong>1.</strong> [이름 설정 모드]를 켜서 참가자들의 이름을 입력하세요.<br>
        <strong>2.</strong> [경기 진행 모드]에서 승리한 참가자의 버블을 클릭하면 터지면서 위로 올라갑니다! 💕
    </div>

    <div class="controls">
        <button id="toggleBtn" class="btn">🎀 현재: 이름 설정 모드 (클릭하여 경기 시작)</button>
        <button id="resetBtn" class="btn" style="background-color: #ff8da1; color: white;">초기화 💫</button>
    </div>

    <div class="scroll-wrapper">
        <div class="pyramid-container" id="pyramid">
            <canvas id="linesCanvas"></canvas>

            <!-- 16강 (R16) -->
            <div class="row r16">
                <!-- Match 1~8 -->
                <div class="match">
                    <div class="bubble pink" id="r16-1" data-target="qf-1"><span class="name" contenteditable="true">참가자 1</span></div>
                    <div class="bubble yellow" id="r16-2" data-target="qf-1"><span class="name" contenteditable="true">참가자 2</span></div>
                </div>
                <div class="match">
                    <div class="bubble green" id="r16-3" data-target="qf-2"><span class="name" contenteditable="true">참가자 3</span></div>
                    <div class="bubble blue" id="r16-4" data-target="qf-2"><span class="name" contenteditable="true">참가자 4</span></div>
                </div>
                <div class="match">
                    <div class="bubble yellow" id="r16-5" data-target="qf-3"><span class="name" contenteditable="true">참가자 5</span></div>
                    <div class="bubble pink" id="r16-6" data-target="qf-3"><span class="name" contenteditable="true">참가자 6</span></div>
                </div>
                <div class="match">
                    <div class="bubble blue" id="r16-7" data-target="qf-4"><span class="name" contenteditable="true">참가자 7</span></div>
                    <div class="bubble green" id="r16-8" data-target="qf-4"><span class="name" contenteditable="true">참가자 8</span></div>
                </div>
                <div class="match">
                    <div class="bubble pink" id="r16-9" data-target="qf-5"><span class="name" contenteditable="true">참가자 9</span></div>
                    <div class="bubble blue" id="r16-10" data-target="qf-5"><span class="name" contenteditable="true">참가자 10</span></div>
                </div>
                <div class="match">
                    <div class="bubble green" id="r16-11" data-target="qf-6"><span class="name" contenteditable="true">참가자 11</span></div>
                    <div class="bubble yellow" id="r16-12" data-target="qf-6"><span class="name" contenteditable="true">참가자 12</span></div>
                </div>
                <div class="match">
                    <div class="bubble yellow" id="r16-13" data-target="qf-7"><span class="name" contenteditable="true">참가자 13</span></div>
                    <div class="bubble pink" id="r16-14" data-target="qf-7"><span class="name" contenteditable="true">참가자 14</span></div>
                </div>
                <div class="match">
                    <div class="bubble blue" id="r16-15" data-target="qf-8"><span class="name" contenteditable="true">참가자 15</span></div>
                    <div class="bubble green" id="r16-16" data-target="qf-8"><span class="name" contenteditable="true">참가자 16</span></div>
                </div>
            </div>

            <!-- 8강 (QF) -->
            <div class="row qf">
                <div class="match">
                    <div class="bubble empty" id="qf-1" data-target="sf-1"></div>
                    <div class="bubble empty" id="qf-2" data-target="sf-1"></div>
                </div>
                <div class="match">
                    <div class="bubble empty" id="qf-3" data-target="sf-2"></div>
                    <div class="bubble empty" id="qf-4" data-target="sf-2"></div>
                </div>
                <div class="match">
                    <div class="bubble empty" id="qf-5" data-target="sf-3"></div>
                    <div class="bubble empty" id="qf-6" data-target="sf-3"></div>
                </div>
                <div class="match">
                    <div class="bubble empty" id="qf-7" data-target="sf-4"></div>
                    <div class="bubble empty" id="qf-8" data-target="sf-4"></div>
                </div>
            </div>

            <!-- 4강 (SF) -->
            <div class="row sf">
                <div class="match">
                    <div class="bubble empty" id="sf-1" data-target="f-1"></div>
                    <div class="bubble empty" id="sf-2" data-target="f-1"></div>
                </div>
                <div class="match">
                    <div class="bubble empty" id="sf-3" data-target="f-2"></div>
                    <div class="bubble empty" id="sf-4" data-target="f-2"></div>
                </div>
            </div>

            <!-- 결승 (Final) -->
            <div class="row final">
                <div class="match">
                    <div class="bubble empty" id="f-1" data-target="winner"></div>
                    <div class="bubble empty" id="f-2" data-target="winner"></div>
                </div>
            </div>

            <!-- 우승 (Winner) -->
            <div class="row w">
                <div class="match">
                    <div class="bubble empty" id="winner"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const colors = ['yellow', 'pink', 'green', 'blue'];
        let isEditMode = true; // 초기 상태는 편집 모드

        const toggleBtn = document.getElementById('toggleBtn');
        const container = document.getElementById('pyramid');

        // 모드 전환 로직
        toggleBtn.addEventListener('click', () => {
            isEditMode = !isEditMode;
            if (isEditMode) {
                toggleBtn.innerHTML = '🎀 현재: 이름 설정 모드 (클릭하여 경기 시작)';
                toggleBtn.classList.add('edit-mode');
                document.body.classList.add('edit-mode');
                
                // 이름 수정 가능하게
                document.querySelectorAll('.bubble:not(.empty) .name').forEach(nameSpan => {
                    nameSpan.setAttribute('contenteditable', 'true');
                });
            } else {
                toggleBtn.innerHTML = '💖 현재: 경기 진행 모드 (버블을 클릭해 승격!)';
                toggleBtn.classList.remove('edit-mode');
                document.body.classList.remove('edit-mode');
                
                // 이름 수정 불가능하게
                document.querySelectorAll('.name').forEach(nameSpan => {
                    nameSpan.setAttribute('contenteditable', 'false');
                });
            }
        });

        // 초기 상태 CSS용 클래스 적용
        document.body.classList.add('edit-mode');
        toggleBtn.classList.add('edit-mode');

        // 캔버스 라인 그리기 (버블끼리 연결)
        function drawLines() {
            const canvas = document.getElementById('linesCanvas');
            const ctx = canvas.getContext('2d');
            
            // 캔버스 크기를 컨테이너 크기에 맞춤
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'var(--line-color)';
            ctx.lineWidth = 4;
            ctx.setLineDash([10, 10]); // 도트 느낌의 점선

            const containerRect = container.getBoundingClientRect();

            document.querySelectorAll('.bubble').forEach(bubble => {
                const targetId = bubble.getAttribute('data-target');
                if (targetId) {
                    const target = document.getElementById(targetId);
                    if(!target) return;

                    const rect1 = bubble.getBoundingClientRect();
                    const rect2 = target.getBoundingClientRect();

                    // 각 요소의 중심점 계산
                    const x1 = rect1.left + rect1.width / 2 - containerRect.left;
                    const y1 = rect1.top + rect1.height / 2 - containerRect.top;
                    const x2 = rect2.left + rect2.width / 2 - containerRect.left;
                    const y2 = rect2.top + rect2.height / 2 - containerRect.top;

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    // 약간의 곡선을 주거나 꺾은선으로 표현 가능, 퍼즐버블 느낌이므로 직선도 무방함
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            });
        }

        // 창 크기가 변하거나 요소 위치가 바뀌면 라인 다시 그리기
        window.addEventListener('resize', drawLines);
        // 최초 로드 시 약간의 딜레이 후 그리기 (폰트 렌더링 완료 후 정확한 위치 확보)
        setTimeout(drawLines, 300);

        // 터지는 파티클 효과 함수
        function createParticles(x, y, colorClass) {
            const colorMap = {
                'yellow': '#fff07c',
                'pink': '#ffa6c9',
                'green': '#a7f3d0',
                'blue': '#a1ccff'
            };
            const colorHex = colorMap[colorClass] || '#ffffff';

            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.backgroundColor = colorHex;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                document.body.appendChild(particle);

                const angle = (Math.PI * 2 / 8) * i;
                const distance = 50 + Math.random() * 30;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 500 + Math.random() * 200,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                }).onfinish = () => particle.remove();
            }
        }

        // 버블 클릭 이벤트 (승격 로직)
        document.querySelectorAll('.bubble').forEach(bubble => {
            bubble.addEventListener('click', function(e) {
                // 편집 모드이거나 비어있으면 동작 안함
                if (isEditMode || this.classList.contains('empty')) return;

                const targetId = this.getAttribute('data-target');
                if (!targetId) {
                    // 우승자 버블을 클릭했을 때 (이펙트만)
                    if(this.id === 'winner' && !this.classList.contains('empty')) {
                        const rect = this.getBoundingClientRect();
                        const colorClass = Array.from(this.classList).find(c => colors.includes(c));
                        createParticles(rect.left + rect.width/2, rect.top + rect.height/2, colorClass);
                        this.classList.add('pop-anim');
                        setTimeout(() => this.classList.remove('pop-anim'), 300);
                    }
                    return; 
                }

                const targetBubble = document.getElementById(targetId);
                const colorClass = Array.from(this.classList).find(c => colors.includes(c));
                const nameText = this.querySelector('.name').innerText;

                // 이미 승급한 사람이 있는 자리라면 덮어씌움 처리
                // 날아가는 시각적 효과 (클론 생성)
                const clone = this.cloneNode(true);
                const rect = this.getBoundingClientRect();
                
                clone.style.position = 'fixed';
                clone.style.left = rect.left + 'px';
                clone.style.top = rect.top + 'px';
                clone.style.margin = '0';
                clone.style.zIndex = '1000';
                clone.style.transition = 'all 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
                clone.style.animation = 'none'; // 떠다니는 애니메이션 정지

                document.body.appendChild(clone);

                // 파티클 생성 (원래 위치)
                createParticles(rect.left + rect.width/2, rect.top + rect.height/2, colorClass);

                // Reflow
                clone.getBoundingClientRect();

                const targetRect = targetBubble.getBoundingClientRect();
                clone.style.left = targetRect.left + 'px';
                clone.style.top = targetRect.top + 'px';

                // 애니메이션 종료 후 처리
                setTimeout(() => {
                    clone.remove();
                    
                    // 타겟 버블 업데이트
                    targetBubble.className = 'bubble'; // empty 등 모두 제거
                    targetBubble.classList.add(colorClass); // 색상 부여
                    targetBubble.innerHTML = `<span class="name" contenteditable="${isEditMode}">${nameText}</span>`;
                    
                    // 파티클 생성 (도착 위치)
                    createParticles(targetRect.left + targetRect.width/2, targetRect.top + targetRect.height/2, colorClass);
                    
                    targetBubble.classList.add('pop-anim');
                    setTimeout(() => targetBubble.classList.remove('pop-anim'), 300);

                    // 우승자에 도달했을 경우 특별 처리
                    if(targetId === 'winner') {
                        setTimeout(() => {
                            alert(`🎉💖 축하합니다! [${nameText}] 님이 최종 우승하셨습니다! 💖🎉`);
                        }, 400);
                    }

                }, 500);
            });
        });

        // 초기화 버튼
        document.getElementById('resetBtn').addEventListener('click', () => {
            if(confirm('대진표를 진행 이전 상태로 초기화하시겠습니까? (이름은 유지됩니다)')) {
                // 상위 라운드 비우기
                document.querySelectorAll('.row:not(.r16) .bubble').forEach(b => {
                    b.className = 'bubble empty';
                    b.innerHTML = '';
                });
            }
        });

    </script>
</body>
</html>
